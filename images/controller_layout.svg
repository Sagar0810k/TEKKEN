<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101018"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ecbff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ecbff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="1060" rx="48" fill="url(#bg)" stroke="#3a4a6a" stroke-width="4"/>
  <text x="360" y="78" fill="#e8f2ff" font-family="Segoe UI, Arial" font-size="34" font-weight="700" text-anchor="middle">PHONE CONTROLLER · portrait</text>
  <text x="360" y="112" fill="#8fa8cc" font-family="Segoe UI, Arial" font-size="20" text-anchor="middle">default layout · drag buttons in the editor to customize</text>

  <!-- D-pad (25%, 55%) size 34 -->
  <circle cx="190" cy="640" r="150" fill="url(#glow)" opacity="0.35"/>
  <g stroke="#cfe6ff" stroke-width="6" fill="rgba(60,90,140,0.45)">
    <path d="M190 540 l38 62 h-76 z"/>
    <rect x="128" y="602" width="124" height="76" rx="10"/>
    <rect x="128" y="678" width="124" height="0"/>
    <path d="M190 740 l38 -62 h-76 z"/>
    <path d="M190 740 l38 -62 h-76 z" fill="none"/>
  </g>
  <!-- redraw simple cross -->
  <g fill="rgba(70,110,170,0.55)" stroke="#dcebff" stroke-width="6">
    <rect x="156" y="516" width="68" height="248" rx="14"/>
    <rect x="66" y="606" width="248" height="68" rx="14"/>
  </g>
  <g fill="#eaf4ff" font-family="Segoe UI" font-size="26" text-anchor="middle" font-weight="700">
    <text x="190" y="560">▲</text>
    <text x="190" y="742">▼</text>
    <text x="102" y="650">◀</text>
    <text x="278" y="650">▶</text>
  </g>
  <text x="190" y="800" fill="#8fa8cc" font-family="Segoe UI" font-size="19" text-anchor="middle">D-PAD · menus & movement</text>

  <!-- face buttons portrait: A(76,62) B(88,51) X(64,51) Y(76,40) size 16 => 62px r -->
  <g font-family="Segoe UI" font-size="30" font-weight="800" text-anchor="middle">
    <circle cx="569" cy="690" r="62" fill="rgba(80,200,120,0.30)" stroke="#7dff9f" stroke-width="5"/>
    <text x="569" y="702" fill="#c9ffd6">A</text>
    <circle cx="661" cy="592" r="62" fill="rgba(235,90,90,0.30)" stroke="#ff8a8a" stroke-width="5"/>
    <text x="661" y="604" fill="#ffd6d6">B</text>
    <circle cx="477" cy="592" r="62" fill="rgba(80,140,255,0.30)" stroke="#8ab8ff" stroke-width="5"/>
    <text x="477" y="604" fill="#d6e6ff">X</text>
    <circle cx="569" cy="494" r="62" fill="rgba(240,220,80,0.30)" stroke="#ffe98a" stroke-width="5"/>
    <text x="569" y="506" fill="#fff6cc">Y</text>
  </g>

  <!-- shoulders LB(14,10) RB(86,10) size 12 -->
  <g font-family="Segoe UI" font-size="24" font-weight="700" text-anchor="middle">
    <rect x="46" y="170" width="140" height="74" rx="20" fill="rgba(140,170,220,0.25)" stroke="#b9d2ff" stroke-width="4"/>
    <text x="116" y="216" fill="#dbe9ff">LB</text>
    <rect x="534" y="170" width="140" height="74" rx="20" fill="rgba(140,170,220,0.25)" stroke="#b9d2ff" stroke-width="4"/>
    <text x="604" y="216" fill="#dbe9ff">RB</text>
  </g>

  <!-- nub (25%,88%) size 16 -->
  <circle cx="190" cy="972" r="62" fill="rgba(120,150,200,0.35)" stroke="#dfeeff" stroke-width="5"/>
  <text x="190" y="982" fill="#eaf4ff" font-family="Segoe UI" font-size="22" font-weight="700" text-anchor="middle">NUB</text>

  <!-- TAG(95,78) size 11 portrait -->
  <rect x="640" y="830" width="66" height="118" rx="16" fill="rgba(255,140,40,0.28)" stroke="#ffb066" stroke-width="5" transform="translate(-33,0)"/>
  <text x="673" y="900" fill="#ffd9b3" font-family="Segoe UI" font-size="24" font-weight="800" text-anchor="middle">TAG</text>

  <!-- START(58,94) BACK(46,94) size 9 -->
  <g font-family="Segoe UI" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="290" y="984" width="104" height="46" rx="12" fill="rgba(160,160,180,0.25)" stroke="#cfd6e6" stroke-width="3"/>
    <text x="342" y="1014" fill="#e6ecf7">START</text>
    <rect x="300" y="984" width="0" height="0"/>
    <rect x="150" y="984" width="104" height="46" rx="12" fill="rgba(160,160,180,0.25)" stroke="#cfd6e6" stroke-width="3"/>
    <text x="202" y="1014" fill="#e6ecf7">BACK</text>
  </g>

  <text x="360" y="150" fill="#7ecbff" font-family="Consolas, monospace" font-size="21" text-anchor="middle">ws://LAPTOP:8000/ws/playerN · one pad per phone</text>
</svg>
